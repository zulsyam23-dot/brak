[package]
name = "brak-lang-lit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "brak-lit"
path = "src/main.rs"

[dependencies]
brak-core = { path = "../brak-core" }
brak-ir-hir = { path = "../brak-ir-hir" }
brak-ir-mir = { path = "../brak-ir-mir" }
brak-ir-lir = { path = "../brak-ir-lir" }
brak-codegen-traits = { path = "../brak-codegen-traits" }
brak-codegen-obj = { path = "../brak-codegen-obj" }
serde = { version = "1", features = ["derive"] }
